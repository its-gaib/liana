name: Fractional fee Bitcoin Core regression tests

on:
  push:
    branches: [feature/sub-sat-fees-v15]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fractional-fees-regtest-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'

jobs:
  regtest:
    name: Core ${{ matrix.core_version }} / ${{ matrix.descriptor }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - core_version: '30.3'
            descriptor: WSH
            use_taproot: '0'
            core_sha256: 4753cd70416c629a2090503e8545a3c05e94a0f5037f8fb97b4c35c6e1afee0e
          - core_version: '29.0'
            descriptor: Taproot
            use_taproot: '1'
            core_sha256: a681e4f6ce524c338a105f214613605bac6c33d58c31dc5135bbc02bc458bb6c
    env:
      CORE_VERSION: ${{ matrix.core_version }}
      CORE_SHA256: ${{ matrix.core_sha256 }}
      USE_TAPROOT: ${{ matrix.use_taproot }}
      BITCOIN_BACKEND_TYPE: bitcoind
      TIMEOUT: '120'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libffi-dev python3-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/liana-test-venv"
          "$RUNNER_TEMP/liana-test-venv/bin/python" -m pip install -r tests/requirements.txt
      - name: Download and verify the pinned official Bitcoin Core binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          core_root="$RUNNER_TEMP/liana-test-core"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            "https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}/bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$CORE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$core_root"
          tar --extract --gzip --file "$archive" --directory "$core_root" \
            --no-same-owner --no-same-permissions --strip-components=2 \
            "bitcoin-${CORE_VERSION}/bin/bitcoind"
          "$core_root/bitcoind" --version
          printf 'BITCOIND_PATH=%s\n' "$core_root/bitcoind" >> "$GITHUB_ENV"
      - name: Install the explicit Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build the debug daemon and CLI
        run: cargo +1.89.0 build --locked -p lianad --bins
      - name: Build the Taproot test signer
        if: matrix.use_taproot == '1'
        working-directory: tests/tools/taproot_signer
        run: cargo +1.89.0 build --locked --release
      - name: Sign, broadcast, replace, and confirm regtest transactions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/liana-test-venv/bin/python" -m pytest -n 2 \
            --junitxml=fractional-fees-test-results.xml \
            tests/test_fractional_fees.py tests/test_spend.py tests/test_rpc.py
      - name: Preserve the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fractional-fees-regtest-core-${{ matrix.core_version }}-${{ matrix.descriptor }}
          path: fractional-fees-test-results.xml
          if-no-files-found: warn
          retention-days: 30
